# personal_website.conf
#
# Installed on the Pi as /etc/nginx/sites-available/personal_website, with a
# symlink from sites-enabled/. One server block: plain HTTP on port 80,
# static files only. TLS is added later, once the site has a real name and a
# way to be reached from outside the LAN.

server {
    # Both families: IPv4 clients arrive on the first, IPv6 on the second.
    listen 80;
    listen [::]:80;

    # We run exactly one site, so match any Host header. Replace "_" with the
    # real name once there is one; that is what lets several sites share port 80.
    server_name _;

    # Do not advertise the exact nginx version in headers and error pages.
    server_tokens off;

    # Where deploy.sh puts the files. Must be readable by nginx's user (www-data).
    root /var/www/personal_website;
    index index.html;

    location / {
        # Serve the file if it exists, then a directory's index.html, else 404.
        try_files $uri $uri/ =404;
    }
}
